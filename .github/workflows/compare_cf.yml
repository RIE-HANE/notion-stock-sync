name: Compare Financial CF

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'  # 毎日定刻実行（手動実行も可）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib japanize-matplotlib pandas notion-client

      # Step 1: 比較対象企業の過去5年分データをDBへ自動収集
      - name: Step 1 - Fetch Compare Financial Data to DB
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python setup_compare_db.py

      # Step 2: 比較表画像を生成
      - name: Step 2 - Generate Compare Table Images
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SYNC_MODE: "GENERATE"
        run: python compare_cf.py

      # Step 3: 生成した画像をGitHubリポジトリへCommit & Push
      - name: Step 3 - Commit and push images
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update comparison DB and table images [skip ci]" && git push)
          git pull --rebase origin main
          git push

      # Step 4: Notionへ比較画像サブページを同期
      - name: Step 4 - Sync Compare Images to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SYNC_MODE: "NOTION_SYNC"
        run: python compare_cf.py
