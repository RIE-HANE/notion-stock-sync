name: Compare Financial CF

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'  # 毎日定刻実行（手動実行も可）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib japanize-matplotlib pandas notion-client

      # Step 1: 比較対象企業の過去5年分データをDBへ自動収集（新規追加）
      - name: Step 1 - Fetch Compare Financial Data to DB
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python setup_compare_db.py

      # Step 2: DBのデータを元に比較表画像（images/）を生成
      - name: Step 2 - Generate Compare Tables
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SYNC_MODE: "GENERATE"
        run: python compare_cf.py

      # Step 3: 更新されたDBファイルおよび比較表画像をGitHubへPush
      - name: Step 3 - Commit & Push DB and Images to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          
          # DBと比較表画像の両方を追加
          git add financial_data.db images/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update comparison DB and table images [skip ci]"
            git push origin main
          fi

      # Step 4: GitHub Raw URL経由でNotionへ同期
      - name: Step 4 - Sync Images to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SYNC_MODE: "NOTION_SYNC"
        run: python compare_cf.py
