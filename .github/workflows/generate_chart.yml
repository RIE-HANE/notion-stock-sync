name: Generate Financial Chart

on:
  schedule:
    - cron: '0 21 * * *' # 毎日日本時間 朝6時
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests matplotlib japanize-matplotlib beautifulsoup4

      - name: Run Financial Chart Generator
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python generate_financial_chart.py

      - name: Commit & Push generated chart images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "Add financial chart images [skip ci]" || echo "No changes to commit"
          git push
