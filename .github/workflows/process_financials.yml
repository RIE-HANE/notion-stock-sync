name: Process Financial Data

on:
  schedule:
    - cron: '0 3 * * *' # 毎日自動実行する場合
  workflow_dispatch:     # 手動実行ボタン

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Financial Pipeline
        run: |
          python scripts/edinet/account_items.py

      - name: Commit and Push DB Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add db/financial_data.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update financial_data.db" && git push)
