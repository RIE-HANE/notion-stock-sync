name: Clean Notion Subpages

on:
  workflow_dispatch:
    inputs:
      target_keyword:
        description: '削除したいサブページのキーワードを選択または入力してください'
        required: true
        default: 'CF比較'
        type: choice
        options:
          - 'CF比較'         # 📊 CF比較 (シャープ vs N E C) など
          - '財務構造分析'     # 🏛 財務構造分析 (BS/PL) など
          - 'ALL_SUBPAGES'   # すべてのサブページを対象にする場合

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Clean Script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TARGET_KEYWORD: ${{ inputs.target_keyword }}
        # ↓↓↓ ここを clean_notion_items.py に修正 ↓↓↓
        run: python clean_notion_items.py
